name: Build P/M Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm packages
        run: npm install

      - name: Trigger web production build (web/ → dist/)
        run: npm run build

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Compile debug APK with Gradle flags
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Upload Finished APK Installer
        uses: actions/upload-artifact@v4
        with:
          name: PM-Capacitor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
