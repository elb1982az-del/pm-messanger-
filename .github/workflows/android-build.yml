name: Build P/M Android APK (Capacitor · org.private.pm_messenger)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # GITHUB_TOKEN needs push rights to publish apk/main
    env:
      PM_LOG: /tmp/pm_buildlog.txt
    steps:
      - run: echo "P/M cloud build run ${GITHUB_RUN_ID} start ${GITHUB_SHA::7}" > "$PM_LOG"
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Verify package identity matches manifest spec (org.private.pm_messenger)
        run: |
          echo "applicationId: $(grep -m1 -oE 'applicationId "[^"]+"' android/app/build.gradle)"
          grep -q 'applicationId "org.private.pm_messenger"' android/app/build.gradle \
            || (echo "WRONG PACKAGE IDENTITY" && exit 1)

      - name: Set up Java 21 (Capacitor 7 template compiles with VERSION_21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm packages
        run: |
          echo "===== STEP: npm install =====" >> "$PM_LOG"
          npm install >> "$PM_LOG" 2>&1

      - name: Trigger web production build (web/ → dist/)
        run: |
          echo "===== STEP: npm run build =====" >> "$PM_LOG"
          npm run build >> "$PM_LOG" 2>&1

      - name: Sync Capacitor native project
        run: |
          echo "===== STEP: cap sync =====" >> "$PM_LOG"
          npx cap sync android >> "$PM_LOG" 2>&1
          # The appId 'org.private.pm_messenger' is legal as applicationId but its 'private'
          # segment is a Java keyword, so the compile-time namespace is pinned post-sync
          sed -i 's|^[[:space:]]*namespace[[:space:]]*=.*|    namespace = "org.pm_messenger"|' android/app/build.gradle
          grep -q 'namespace = "org.pm_messenger"' android/app/build.gradle || (echo "namespace pin failed" && exit 1)

      - name: Compile debug APK with Gradle flags
        run: |
          echo "===== STEP: gradle assembleDebug =====" >> "$PM_LOG"
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g" >> "$PM_LOG" 2>&1

      - name: Upload Finished APK Installer
        uses: actions/upload-artifact@v4
        with:
          name: PM-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish compiled APK to branch apk/main (git-retrievable fallback)
        run: |
          STAGE=$(mktemp -d)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$STAGE/"
          cd "$STAGE"
          git init -q -b apk/main
          git config user.name "PM-CI"
          git config user.email "pm-ci@users.noreply.github.com"
          git add app-debug.apk
          git commit -q -m "P/M debug APK — run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin apk/main
        if: success()

      - name: Publish build log on failure (SSH-retrievable diagnostics branch)
        if: failure()
        run: |
          STAGE=$(mktemp -d)
          cp "$PM_LOG" "$STAGE/buildlog-${GITHUB_RUN_ID}.txt"
          cd "$STAGE"
          git init -q -b apk-logs/main
          git config user.name "PM-CI"
          git config user.email "pm-ci@users.noreply.github.com"
          git add .
          git commit -q -m "P/M failed run ${GITHUB_RUN_ID} diagnostics"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin apk-logs/main
