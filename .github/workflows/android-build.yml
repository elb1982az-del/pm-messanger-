name: Build P/M Android APK (Capacitor · org.private.pm_messenger)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # GITHUB_TOKEN needs push rights to publish apk/main
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Verify package identity matches manifest spec (org.private.pm_messenger)
        run: |
          echo "applicationId: $(grep -m1 -oE 'applicationId "[^"]+"' android/app/build.gradle)"
          grep -q 'applicationId "org.private.pm_messenger"' android/app/build.gradle \
            || (echo "WRONG PACKAGE IDENTITY" && exit 1)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm packages
        run: npm install

      - name: Trigger web production build (web/ → dist/)
        run: npm run build

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Compile debug APK with Gradle flags
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Upload Finished APK Installer
        uses: actions/upload-artifact@v4
        with:
          name: PM-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish compiled APK to branch apk/main (git-retrievable fallback)
        run: |
          STAGE=$(mktemp -d)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$STAGE/"
          cd "$STAGE"
          git init -q -b apk/main
          git config user.name "PM-CI"
          git config user.email "pm-ci@users.noreply.github.com"
          git add app-debug.apk
          git commit -q -m "P/M debug APK — run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin apk/main
        if: success()
