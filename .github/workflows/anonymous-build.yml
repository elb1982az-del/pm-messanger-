name: Build Anonymous APK (org.private.anonymous — Tor P2P, Phase skeleton)

on:
  push:
    branches: [ main ]
    paths:
      - 'anonymous/**'
      - '.github/workflows/anonymous-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PM_LOG: /tmp/pm_anon_buildlog.txt
    steps:
      - run: echo "Anonymous build run ${GITHUB_RUN_ID} start ${GITHUB_SHA::7}" > "$PM_LOG"

      - uses: actions/checkout@v4

      - name: Mark run started (git-reachable event marker)
        if: always()
        run: |
          STAGE=$(mktemp -d)
          echo "$(date -u +%FT%TZ) run ${GITHUB_RUN_ID} for ${GITHUB_SHA::7} — started" > "$STAGE/MARKER.txt"
          cd "$STAGE"
          git init -q -b apk-events/anonymous
          git config user.name "Anonymous-CI"
          git config user.email "anon-ci@users.noreply.github.com"
          git add .
          git add . && git commit -q -m "run ${GITHUB_RUN_ID} start (${GITHUB_SHA::7})"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin apk-events/anonymous
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build obfs4proxy native libs (dx-style vendoring, pure-Go static)
        if: always()
        run: |
          echo "===== STEP: obfs4proxy (Go) =====" >> "$PM_LOG"
          git clone --depth 1 https://gitlab.com/yawning/obfs4.git /tmp/obfs4 >> "$PM_LOG" 2>&1 || { echo "obfs4 clone failed (optional; rung-1 unaffected)" >> "$PM_LOG"; exit 0; }
          cd /tmp/obfs4/obfs4proxy
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/anonymous/android/app/src/main/jniLibs/arm64-v8a/libobfs4proxy.so" . >> "$PM_LOG" 2>&1 || echo "obfs4 arm64 build failed (optional)" >> "$PM_LOG"
          CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/anonymous/android/app/src/main/jniLibs/armeabi-v7a/libobfs4proxy.so" . >> "$PM_LOG" 2>&1 || echo "obfs4 armv7 build failed (optional)" >> "$PM_LOG"

      - name: Install npm packages
        working-directory: anonymous
        run: |
          echo "===== STEP: npm install =====" >> "$PM_LOG"
          npm install >> "$PM_LOG" 2>&1

      - name: Build web assets (web/ → dist/)
        working-directory: anonymous
        run: |
          echo "===== STEP: npm run build =====" >> "$PM_LOG"
          npm run build >> "$PM_LOG" 2>&1

      - name: Sync Capacitor native project
        working-directory: anonymous
        run: |
          echo "===== STEP: cap sync =====" >> "$PM_LOG"
          npx cap sync android >> "$PM_LOG" 2>&1
          # 'private' is a Java keyword — the legal compile-time namespace is pinned post-sync
          sed -i 's|^[[:space:]]*namespace[[:space:]]*=.*|namespace = "org.onionchat"|' android/app/build.gradle
          grep -q 'namespace = "org.onionchat"' android/app/build.gradle || (echo "namespace pin failed" && exit 1)

      - name: Compile debug APK
        working-directory: anonymous/android
        run: |
          echo "===== STEP: gradle assembleDebug =====" >> "$PM_LOG"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g" >> "$PM_LOG" 2>&1
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/anonymous/app-debug.apk"

      - name: Publish Anonymous APK (SSH-retrievable branch)
        if: success()
        run: |
          STAGE=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/anonymous/app-debug.apk" "$STAGE/app-debug.apk"
          echo "run ${GITHUB_RUN_ID} (${GITHUB_SHA::7}) at $(date -u +%FT%TZ)" > "$STAGE/BUILD_INFO.txt"
          cd "$STAGE"
          git init -q -b apk/anonymous
          git config user.name "Anonymous-CI"
          git config user.email "anon-ci@users.noreply.github.com"
          git add .
          git commit -q -m "Anonymous debug APK — run ${GITHUB_RUN_ID} ${GITHUB_DATA:0:0}(${GITHUB_SHA::7})"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin apk/anonymous

      - name: Publish build log on failure
        if: failure()
        run: |
          STAGE=$(mktemp -d)
          cp "$PM_LOG" "$STAGE/buildlog-${GITHUB_RUN_ID}.txt"
          cd "$STAGE"
          git init -q -b apk-logs/anonymous
          git config user.name "Anonymous-CI"
          git config user.email "anon-ci@users.noreply.github.com"
          git add .
          git commit -q -m "Anonymous failed run ${GITHUB_RUN_ID} diagnostics"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin apk-logs/anonymous
