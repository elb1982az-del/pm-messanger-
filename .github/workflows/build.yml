name: Build P/M Android Messenger APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Compilation Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libgdbm-dev libsqlite3-dev libbz2-dev zlib1g-dev openssl libreadline-dev libncursesw5-dev libncurses-dev zip unzip openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer Cython==0.29.36 kivy cryptography requests urllib3

      - name: Compile Application to APK
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 buildozer android debug

      - name: Upload Finished APK Installer
        uses: actions/upload-artifact@v4
        with:
          name: PM-Private-Messenger-APK
          path: bin/*.apk
